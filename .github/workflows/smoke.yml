name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    # On 12 Nov 2026 ubuntu-latest became 26.04, which Playwright 1.56.1 had no Chromium build for, and this was
    # pinned to 24.04 for a day. package.json's playwright is 1.63.0 since, which has one. If a new runner image
    # does it again, raise that version rather than pin the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
