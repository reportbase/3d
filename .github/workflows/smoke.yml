name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    # Pinned (12 Nov 2026): ubuntu-latest became 26.04, which Playwright 1.56.1 has no Chromium build for
    # ("Playwright does not support chromium on ubuntu26.04-x64"), so the job fails before any test runs
    # (draw's did). Move it on together with the playwright version in package.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
